# Реле на ESP32 для Юї (ESPHome + MQTT, без Home Assistant).
# Прошивка: pip install esphome && esphome run relay.yaml
# Для кожного пристрою зміни substitutions (device_id має збігатися з config/devices.toml).

substitutions:
  device_id: kitchen_light     # -> топіки yui/kitchen_light/set і yui/kitchen_light/state
  friendly_name: "Світло на кухні"
  relay_pin: GPIO4
  auto_off_ms: "0"             # Автовимкнення в мс, для чайника: "300000" (5 хв). "0" - вимкнено

esphome:
  name: yui-${device_id}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1    # Для звичайного ESP32: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                          # Точка доступу на випадок, якщо Wi-Fi недоступний
    ssid: yui-${device_id}
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false             # Home Assistant не використовуємо
  topic_prefix: yui/${device_id}

switch:
  - platform: gpio
    id: relay
    name: ${friendly_name}
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF   # Після перезавантаження чи зникнення світла - вимкнено
    command_topic: yui/${device_id}/set
    state_topic: yui/${device_id}/state
    on_turn_on:
      - if:
          condition:
            lambda: 'return ${auto_off_ms} > 0;'
          then:
            - script.execute: auto_off_timer
    on_turn_off:
      - script.stop: auto_off_timer

script:
  - id: auto_off_timer
    mode: restart              # Повторне вмикання перезапускає відлік
    then:
      - delay: !lambda 'return ${auto_off_ms};'
      - switch.turn_off: relay
